<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        iframe {
            box-shadow: 0 0 12px #00000022;
            width: 1000px;
            max-width: calc(100% - 40px);
            aspect-ratio: 3.5 / 2.1;
            /* height: 600px; */
            border-radius: 25px;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }

        .loader {
            display: flex;
            justify-content: center;
            align-items: center;
            position: absolute;
            top: 50%;
            left: 50%;
            opacity: 1;
            transform: translate(-50%, -50%);
            pointer-events: none;
            transition: opacity .5s ease-out;
        }

        .loader.hide {
            display: none !important;
        }

        .loader.fade-out {
            opacity: 0;
        }

        .clock {
            width: 80px;
            height: 80px;
            background-color: #333;
            position: relative;
            border-radius: 50%;
        }

        .big-niddle,
        .small-niddle {
            position: absolute;
            top: 50%;
            left: 50%;
            width: calc(50% - 5px);
            height: 1px;
            background-color: #ffffff;
            transform-origin: left center;
            animation: clock-animation .60s linear infinite;
        }

        .small-niddle {
            width: calc(50% - 15px);
            height: 2px;
            background-color: #000000;
            animation: clock-animation 6s linear infinite;
        }

        @keyframes clock-animation {
            from {
                transform: rotate(0deg);
            }

            to {
                transform: rotate(360deg);
            }
        }
    </style>
</head>

<body>
    <iframe src="https://www.wearemountainman.com/" frameborder="0"></iframe>

    <div class="loader">
        <div class="clock">
            <div class="big-niddle"></div>
            <div class="small-niddle"></div>
        </div>
    </div>

    <script>
        const iframe = document.querySelector('iframe');
        const loader = document.querySelector('.loader');

        iframe.onload = () => {
            loader.classList.add('fade-out');
            setTimeout(() => {
                loader.classList.add('hide');
            }, 500);
        }

    </script>
</body>

</html>
